name: Build and Release

on:
    push:
        branches:
            - dev
        tags:
            - "[0-9]*"
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        name: Build GraphDLC
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Validate release tag
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-test[0-9]+)?$ ]]; then
                      echo "Invalid tag: $TAG"
                      echo "Expected X.Y.Z, X.Y.Z.N, optionally followed by -testN"
                      exit 1
                  fi

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-opt
              run: |
                  sudo apt-get update
                  sudo apt-get install -y binaryen

            - name: Install dependencies
              run: npm ci

            - name: Set version from tag
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  TAG="$TAG" node --input-type=module -e "
                      import fs from 'node:fs';

                      const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                      pkg.version = process.env.TAG;
                      fs.writeFileSync('package.json', JSON.stringify(pkg, null, 4) + '\n');
                  "

            - name: Build
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: graphdlc-build
                  path: dist/*-dist.zip
                  if-no-files-found: error
                  retention-days: 14

    release:
        name: Publish GitHub Release
        needs: build
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate stable release target
              if: ${{ !contains(github.ref_name, '-test') }}
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  git fetch origin main

                  git merge-base --is-ancestor "$TAG" origin/main || {
                      echo "Stable releases must point to a commit in main"
                      exit 1
                  }

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: graphdlc-build
                  path: release-input

            - name: Prepare release assets
              run: |
                  mkdir -p release
                  cp release-input/newchrome-dist.zip release/newchrome.zip
                  cp release-input/oldchrome-dist.zip release/oldchrome.zip
                  cp release-input/tampermonkey-dist.zip release/tampermonkey.zip
                  cp release-input/viamobile-dist.zip release/viamobile.zip

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: GraphDLC ${{ github.ref_name }}
                  prerelease: ${{ contains(github.ref_name, '-test') }}
                  generate_release_notes: true
                  files: release/*.zip
